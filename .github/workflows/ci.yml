name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/laxiriir_expert"
      VITE_API_BASE_URL: "http://localhost:8081"
      EXPO_PUBLIC_API_BASE_URL: "http://localhost:8081"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace boundaries
        run: pnpm exec turbo boundaries

      - name: Validate monorepo
        run: pnpm exec turbo run lint typecheck test build
